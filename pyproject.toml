[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-hep"
version = "2.0.0"
description = "Typed graph reconstruction and event classification for particle physics"
requires-python = ">=3.10"
dependencies = [
  "h5py",
  "hydra-core",
  "lightning",
  "matplotlib",
  "numpy",
  "omegaconf",
  "optuna",
  "pandas",
  "scikit-learn",
  "torch",
  "torch-geometric",
  "torchmetrics",
]


[tool.setuptools.packages.find]
include = ["HyPER*"]

