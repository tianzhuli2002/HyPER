# @package _global_
topology: ttH
dataset:
  root: /mnt/iusers01/fatpou01/phy01/w00238tl/scratch/HyPER_24_2/HyPER_ttH_SL_typed/
  source_h5_path: /mnt/iusers01/fatpou01/phy01/w00238tl/scratch/HyPER_24_2/HyPER_ttH_SL_typed/raw/hyper_converted_ttH_ttbb_train_10M_23May.h5
  train_set: hyper_converted_ttH_ttbb_train_10M_23May
  predict_set: hyper_converted_ttH_ttbb_train_10M_23May
  split:
    train_fraction: 0.8
    val_fraction: 0.1
    test_fraction: 0.1
    stratify: true
    seed: 42
    cache_path: null
    predict_split: test
    require_existing: false
    allow_unstratified: false
    allow_zero_test: false
model:
  message_feats: 64
  contraction_feats: 128
  dropout: 0.0089603395458858
  num_message_passing_layers: 3
  hyperedge_order: 3
loss:
  classification_pos_weight: null
  edge_class_weights:
    tlep_b: 1.0
    Whad: 1.0
    H: 1.0
    background: 1.0
  hyperedge_class_weights:
    tlep: 1.0
    thad: 1.0
    background: 1.0
optimizer:
  name: adamw
  learning_rate: 0.0007804629705858
  weight_decay: 0.0007553503645583
  foreach: null
  fused: false
lr_scheduler:
  enabled: true
  monitor: val_loss
  mode: min
  factor: 0.7
  patience: 5
  min_lr: 1.0e-06
  frequency: 2
input:
  padding: 10
  nodes:
    JET: 1
    LEPTON: 2
    MET: 3
  node_features:
  - e
  - eta
  - sin_phi
  - cos_phi
  - pt
  - btag
  - charge
  - id
  node_transforms:
  - torch.log(x)
  - x
  - x
  - x
  - torch.log(x)
  - x/6
  - x
  - x/4
  edge_features:
  - delta_eta
  - delta_phi
  - delta_R
  - M2
  global_features:
  - njet
  - nBjets
  global_transforms:
  - x/8
  - x/8
target:
  edge:
    tlep_b:
    - 1-4
    - 2-1
    Whad:
    - 1-2
    - 1-3
    H:
    - 1-5
    - 1-6
  hyperedge:
    tlep:
    - 1-4
    - 2-1
    - 3-1
    thad:
    - 1-1
    - 1-2
    - 1-3
