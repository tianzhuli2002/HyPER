# @package _global_
topology: ttbar1L
dataset:
  root: /mnt/iusers01/fatpou01/phy01/w00238tl/scratch/HyPER_24_2/HyPER_ttbarSL_typed
  source_h5_path: /mnt/iusers01/fatpou01/phy01/w00238tl/scratch/HyPER_24_2/HyPER_ttbarSL_typed/raw/training_dataset_even.h5
  train_set: training_dataset_even
  predict_set: training_dataset_even
  split:
    train_fraction: 0.8
    val_fraction: 0.1
    test_fraction: 0.1
    stratify: true
    seed: 42
    cache_path: null
    predict_split: test
    require_existing: false
    allow_unstratified: false
    allow_zero_test: false
model:
  message_feats: 64
  contraction_feats: 128
  dropout: 0.0150037556889483
  num_message_passing_layers: 3
  hyperedge_order: 3
loss:
  classification_pos_weight: null
  edge_class_weights:
    Wlep: 1.0
    Whad: 1.0
    background: 1.0
  hyperedge_class_weights:
    tlep: 1.0
    thad: 1.0
    background: 1.0
optimizer:
  name: adamw
  learning_rate: 0.0008727390580528
  weight_decay: 0.0002137027267236
  foreach: null
  fused: false
lr_scheduler:
  enabled: true
  monitor: val_loss
  mode: min
  factor: 0.5
  patience: 5
  min_lr: 1.0e-06
  frequency: 2
input:
  padding: 23
  nodes:
    JET: 1
    LEPTON: 2
    MET: 3
  node_features:
  - e
  - eta
  - phi
  - pt
  - btag
  - charge
  - id
  node_feature_transforms:
    phi: sincos
  node_transforms:
  - torch.log(x)
  - x
  - x
  - x
  - torch.log(x)
  - x/6
  - x
  - x/4
  edge_features:
  - delta_eta
  - delta_phi
  - delta_R
  - M2
  global_features:
  - njet
  - nBJets_90
  - nBJets_85
  - nBJets_77
  - nBJets_70
  - nBJets_65
  global_transforms:
  - x/8
  - x/8
  - x/8
  - x/8
  - x/8
  - x/8
target:
  edge:
    Wlep:
    - 2-1
    - 3-1
    Whad:
    - 1-3
    - 1-4
  hyperedge:
    tlep:
    - 1-1
    - 2-1
    - 3-1
    thad:
    - 1-2
    - 1-3
    - 1-4
