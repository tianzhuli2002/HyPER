# Active typed ttH single-lepton reconstruction configuration.
config_name: ttH_SL_typed

general:
  seed: 42

dataset:
  root: /mnt/iusers01/fatpou01/phy01/w00238tl/scratch/HyPER_24_2/HyPER_ttH_SL_typed/
  source_h5_path: /mnt/iusers01/fatpou01/phy01/w00238tl/scratch/HyPER_24_2/HyPER_ttH_SL_typed/raw/hyper_converted_ttH_ttbb_train_10M_23May.h5
  train_set: hyper_converted_ttH_ttbb_train_10M_23May
  val_set: ''
  predict_set: hyper_converted_ttH_ttbb_train_10M_23May
  batch_size: 4096
  drop_last: true
  num_workers: 16
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  force_reload: false
  use_ondisk: true
  split:
    enabled: true
    train_fraction: 0.8
    val_fraction: 0.1
    test_fraction: 0.1
    stratify: true
    seed: 42
    cache_path: null
    predict_split: test
    require_existing: false
    allow_unstratified: false
    allow_zero_test: false

model:
  message_feats: 64
  contraction_feats: 128
  dropout: 0.0089603395458858
  num_message_passing_layers: 3
  hyperedge_order: 3

reconstruction:
  enabled: true

classification:
  enabled: false

loss:
  edge_weight: 0.5
  hyperedge_weight: 0.5
  classification_weight: 0.0
  classification_pos_weight: null
  edge_class_weights:
    tlep_b: 1.0
    Whad: 1.0
    H: 1.0
    background: 1.0
  hyperedge_class_weights:
    tlep: 1.0
    thad: 1.0
    background: 1.0

optimizer:
  # AdamW with a moderately higher LR is used to reduce very long 300+ epoch training runs.
  name: adamw
  learning_rate:  0.0007804629705858
  weight_decay: 0.0007553503645583
  foreach: null
  fused: false

validation_diagnostics:
  role_ranking_enabled: false
  classification_metrics_enabled: false
  every_n_epochs: 1
  max_events: null

performance:
  verify_source_identity_per_event: false
  source_identity_setup_samples: 32
  validate_candidate_event_assignment: false

lr_scheduler:
  enabled: true
  method: reduce_on_plateau
  monitor: val_loss
  mode: min
  factor: 0.7
  patience: 5
  min_lr: 1.0e-6
  frequency: 2

trainer:
  accelerator: gpu
  devices: 1
  epochs: 500
  precision: bf16-mixed
  gradient_clip_val: 2.0
  log_every_n_steps: 50
  check_val_every_n_epoch: 2
  limit_train_batches: null
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  run_test_after_fit: true
  val_check_interval: null
  num_sanity_val_steps: 0
  enable_progress_bar: false

profiling:
  enabled: false
  log_every_n_steps: 50
  cuda_synchronize: false
  output_json: null

paths:
  savedir: HyPER_logs
  training_manifest: null
  checkpoint: null

training:
  resume_from_checkpoint: null

early_stopping:
  enabled: true
  monitor: val_loss
  mode: min
  patience: 20

predicting:
  accelerator: cpu
  split: test
  model_directory: null
  checkpoint: null
  save_as: null
  topology: ttH

  # Prediction-specific safety settings.
  batch_size: 1024
  chunk_size_events: 100000
  max_events: null
  source_indices_file: null
  output_mode: selected
  memory_log_every_batches: 500
  overwrite: false
  strategy: higgs_first

onnx_export:
  accelerator: ${predicting.accelerator}
  model_directory: null
  checkpoint: null
  save_as: HyPER.onnx

input:
  padding: 10
  nodes:
    JET: 1
    LEPTON: 2
    MET: 3
  node_features:
    - e
    - eta
    - sin_phi
    - cos_phi
    - pt
    - btag
    - charge
    - id
  node_transforms:
    - torch.log(x)
    - x
    - x
    - x
    - torch.log(x)
    - x/6
    - x
    - x/4
  edge_features:
    - delta_eta
    - delta_phi
    - delta_R
    - M2
  global_features:
    - njet
    - nBjets

  global_transforms:
    - x/8
    - x/8
  pre_transform: true

target:
  encoding: typed
  edge:
    tlep_b:
      - '1-4'
      - '2-1'
    Whad:
      - '1-2'
      - '1-3'
    H:
      - '1-5'
      - '1-6'

  hyperedge:
    tlep:
      - '1-4'
      - '2-1'
      - '3-1'
    thad:
      - '1-1'
      - '1-2'
      - '1-3'
