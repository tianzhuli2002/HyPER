# @package _global_
task:
  mode: probe
loss:
  edge_weight: 0.0
  hyperedge_weight: 0.0
  classification_weight: 1.0
probe:
  pretrained_model_directory: null
  pretrained_checkpoint: null
  trainable_parameter_prefixes:
  - Classification.
optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0
trainer:
  epochs: 50
  check_val_every_n_epoch: 1
early_stopping:
  enabled: true
  monitor: val_loss
  mode: min
  patience: 10
